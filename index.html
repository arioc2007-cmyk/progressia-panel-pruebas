const privacy=`<div class="privacy" id="privacy"><strong>AVISO DE PRIVACIDAD · BORRADOR PARA PRUEBAS</strong><p>Progressia es una plataforma independiente de seguimiento del desarrollo de agentes. Responsable provisional: Luilly Rivero; antes del lanzamiento se identificará la entidad operadora, domicilio y contacto verificable.</p><h3>Datos tratados</h3><p>Nombre, correo, ID WFG que declara el agente, constructor asociado, invitación, estados de aprobación y registros de auditoría. La autenticación está gestionada por el proveedor configurado. No introduzcas datos reales hasta completar la revisión legal y los controles de producción.</p><h3>Finalidades y accesos</h3><p>Crear la cuenta, verificar el correo, gestionar invitaciones y permitir que el constructor directo revise y apruebe la solicitud. El constructor ve únicamente las solicitudes asociadas a sus invitaciones. Un administrador técnico no recibe acceso libre a los expedientes por su función.</p><h3>Almacenamiento y terceros</h3><p>El proveedor de autenticación y base de datos configurado procesará la información para ofrecer el servicio. Región, condiciones, plazos de conservación, transferencias y posibles proveedores adicionales deberán concretarse antes del lanzamiento público.</p><h3>Derechos y seguridad</h3><p>Antes de activar usuarios reales se publicarán los canales de contacto, las instrucciones para ejercer derechos aplicables, los plazos de conservación y el procedimiento de incidentes. Los permisos deben verificarse en el servidor y la base de datos.</p><h3>Independencia</h3><p>Progressia no afirma estar afiliada, aprobada ni conectada a WFG. El constructor verifica manualmente el ID declarado; ello no equivale a una verificación oficial automatizada.</p></div>`;

  const {data,error}=await sb.from('gx_production').select('id,company,product_name,insured_reference,target_premium,coverage,factor_applied,production_date,points,verified_at,voided_at').eq('agent_id',state.user.id).order('created_at',{ascending:false}).limit(15);
  if(error)throw error;if(!box.isConnected)return;
  box.innerHTML=`<h3>Mis pólizas recientes</h3>${data.length?data.map(p=>`<div class="note ${p.verified_at&&!p.voided_at?'success':''}"><strong>${esc(p.product_name||'Producto no registrado')}</strong> · ${esc(GX_COMPANIES[p.company]||p.company)}${p.insured_reference?`<br>Persona: ${esc(p.insured_reference)}`:''}<br>Fecha: ${esc(p.production_date)}<br>Prima target mensual: ${gxMoney(p.target_premium)}${p.coverage!=null?`<br>Cobertura: ${gxMoney(p.coverage)}`:''}${p.factor_applied!=null?`<br>Factor aplicado: ${Number(p.factor_applied)*100} %`:''}<br>Puntos calculados: ${p.points==null?'Pendientes de cálculo':gxPoints(p.points)}<br><strong>Estado: ${p.voided_at?'Anulada':p.verified_at?'Verificada y contabilizada':'Pendiente · no contabilizada'}</strong></div>`).join(''):'<p class="gx-help">Aún no hay pólizas registradas.</p>'}`;
 }catch(e){box.textContent='No fue posible consultar tus pólizas: '+friendly(e);}
}

async function loadDirectAssociates(){
 const box=$('direct-associates');if(!box||!state.isBuilder)return;
 try{
  const [{data:rows,error},{data:apps,error:appError}]=await Promise.all([sb.from('direct_associate_pipeline').select('id,full_name,wfg_id,invitation_token,created_at,updated_at').eq('constructor_id',state.user.id).order('created_at',{ascending:false}),sb.from('applications').select('agent_id,full_name,wfg_id,status').eq('constructor_id',state.user.id)]);
  if(error||appError)throw error||appError;
  const byWfg=new Map((apps||[]).map(a=>[String(a.wfg_id||'').toUpperCase(),a]));
  box.innerHTML=`<form id="direct-associate-form" class="planner-form"><label>Nombre del asociado<input name="full_name" maxlength="120" required placeholder="Nombre del agente de prueba"></label><label>ID WFG<input name="wfg_id" maxlength="40" pattern="[A-Za-z0-9-]{2,40}" required placeholder="ID WFG"></label><button class="btn" type="submit">Agregar asociado directo y crear invitación</button></form><div class="planner-list">${rows?.length?rows.map(x=>{const app=byWfg.get(String(x.wfg_id).toUpperCase()),status=app?.status==='approved'?'Activo en mi equipo':app?.status==='pending'?'Solicitud pendiente':'Por registrarse',link=x.invitation_token?`${location.origin}${location.pathname}?invite=${encodeURIComponent(x.invitation_token)}`:'';return `<article class="planner-item"><strong>${esc(x.full_name)}</strong><div class="gx-help">ID WFG: ${esc(x.wfg_id)} · ${esc(status)}</div>${link&&!app?`<label class="field"><span>Enlace personal</span><input readonly value="${esc(link)}" aria-label="Enlace de invitación para ${esc(x.full_name)}"></label><button type="button" class="btn alt copy-direct-invite" data-link="${esc(link)}">Copiar invitación</button>`:''}</article>`}).join(''):'<p class="muted">Aún no has agregado asociados directos.</p>'}</div>`;
  $('direct-associate-form').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,b=form.querySelector('button'),f=new FormData(form);await busy(b,async()=>{await call('add_direct_associate',{p_full_name:String(f.get('full_name')).trim(),p_wfg_id:String(f.get('wfg_id')).trim()});form.reset();await loadDirectAssociates();setMessage('Asociado directo agregado. Ya puedes compartir su invitación personal.');});};
  box.querySelectorAll('.copy-direct-invite').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(b.dataset.link).then(()=>setMessage('Invitación copiada.')).catch(()=>setMessage('Selecciona y copia el enlace mostrado.')));
 }catch(e){if(box.isConnected)box.innerHTML=`<p class="note error">No se pudieron cargar tus asociados directos: ${esc(friendly(e))}</p>`;}
}
async function loadTeamProgress(applications){
 const box=$('team-progress');if(!box)return;
 const members=applications.filter(a=>['pending','approved'].includes(a.status));
 if(!members.length){if($('builder-average-progress'))$('builder-average-progress').textContent='—';box.innerHTML='<p class="muted">Aún no tienes agentes con solicitudes pendientes o aprobadas.</p>';state.selectedTeamAgent=null;const detail=$('team-agent-detail');if(detail)detail.innerHTML='';return;}
 try{
  const {steps,progress}=await getStepsAndProgress(members.map(a=>a.agent_id));if(!box.isConnected)return;
  const approved=members.filter(a=>a.status==='approved');const avg=approved.length?Math.round(approved.reduce((sum,a)=>sum+pct(progress.filter(p=>p.agent_id===a.agent_id&&p.status==='completed').length,steps.length),0)/approved.length):null;if($('builder-average-progress'))$('builder-average-progress').textContent=avg===null?'—':avg+'%';
  box.innerHTML=members.map(a=>{
   const rows=progress.filter(p=>p.agent_id===a.agent_id),completed=rows.filter(p=>p.status==='completed').length,percent=pct(completed,steps.length);
   const doneIds=new Set(rows.filter(p=>p.status==='completed').map(p=>p.step_id));const next=steps.find(s=>!doneIds.has(s.id));
   return `<article class="team-card"><div class="topline"><div><strong>${esc(a.full_name)}</strong><br><small>ID: ${esc(a.wfg_id)} · ${a.status==='pending'?'Solicitud pendiente':'Solicitud aprobada'}</small></div>${a.status==='approved'?`<span class="percent">${percent}%</span>`:'<span class="percent">—</span>'}</div>${a.status==='approved'?`<div class="progress-track"><div class="progress-fill" style="width:${percent}%"></div></div><small>${completed} de ${steps.length} pasos. Próximo: ${esc(next?.title||'Ruta completada')}</small><div class="team-metrics" id="team-metrics-${esc(a.agent_id)}"><div class="team-metric"><small>GX / Producción</small><strong>…</strong></div><div class="team-metric"><small>Cash flow</small><strong>…</strong></div></div><button class="btn alt open-team-route" type="button" data-agent-id="${esc(a.agent_id)}" aria-label="Abrir ruta de ${esc(a.full_name)}">Abrir ruta y notas</button>`:'<p class="gx-help">El avance se mostrará cuando la solicitud esté aprobada. Solo entonces podrás abrir y editar su ruta.</p>'}</article>`;
  }).join('');
  await Promise.all(approved.map(a=>loadTeamCardMetrics(a.agent_id)));
  box.querySelectorAll('.open-team-route').forEach(b=>b.addEventListener('click',()=>{
   const a=members.find(x=>x.agent_id===b.dataset.agentId&&x.status==='approved');if(!a)return;
   if(state.selectedTeamAgent?.id===a.agent_id){state.selectedTeamAgent=null;const detail=$('team-agent-detail');if(detail)detail.innerHTML='';return;}
   state.selectedTeamAgent={id:a.agent_id,name:a.full_name};loadTeamAgentProgress();
  }));
  if(state.selectedTeamAgent){const selected=members.find(a=>a.agent_id===state.selectedTeamAgent.id&&a.status==='approved');if(selected){state.selectedTeamAgent.name=selected.full_name;loadTeamAgentProgress();}else{state.selectedTeamAgent=null;const detail=$('team-agent-detail');if(detail)detail.innerHTML='';}}
 }catch(e){if($('builder-average-progress'))$('builder-average-progress').textContent='—';box.innerHTML=`<p class="note error">${esc(friendly(e))}</p>`}
}
async function loadTeamAgentProgress(){
 const box=$('team-agent-detail'),selected=state.selectedTeamAgent;
 if(!box||!selected||!state.isBuilder)return;
 box.innerHTML='<p class="muted">Cargando la ruta del agente…</p>';
 try{
  // A fresh membership check avoids relying only on a client-side selected ID.
  const {data:member,error:memberError}=await sb.from('applications').select('agent_id,full_name,status').eq('agent_id',selected.id).eq('constructor_id',state.user.id).eq('status','approved').maybeSingle();
  if(memberError)throw memberError;
  if(!member)throw Error('Solo puedes editar las rutas de los agentes aprobados de tu equipo.');
  const {steps,progress}=await getStepsAndProgress([member.agent_id]);
  if(!box.isConnected||state.selectedTeamAgent?.id!==member.agent_id)return;
  const byStep=new Map(progress.map(p=>[p.step_id,p]));const completed=steps.filter(s=>byStep.get(s.id)?.status==='completed').length;const percent=pct(completed,steps.length);const currentStep=steps.find(s=>byStep.get(s.id)?.status!=='completed');
  box.innerHTML=`<section class="team-agent-detail" aria-label="Ruta del agente"><h3>Ruta de ${esc(member.full_name)}</h3><p class="muted">${completed} de ${steps.length} pasos completados · ${percent}%</p>${currentStep?`<div class="next-task"><span class="next-task-label">Paso actual por completar</span><small>Paso ${currentStep.sort_order} de ${steps.length}</small><strong>${esc(currentStep.title)}</strong></div>`:`<p class="success note">Ruta completada.</p>`}<div class="progress-track" role="progressbar" aria-label="Avance del agente" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percent}"><div class="progress-fill" style="width:${percent}%"></div></div><p class="gx-help">El agente y tú comparten estas tareas y notas. La última modificación guardada prevalece si ambos editan al mismo tiempo.</p><div class="steps">${steps.map(s=>{const p=byStep.get(s.id);const done=p?.status==='completed';const who=p?.updated_by===member.agent_id?'Agente':p?.updated_by===state.user.id?'Constructor':'Sin registrar';const when=p?.updated_at?new Date(p.updated_at).toLocaleString('es-US'):'';return `<article class="step ${done?'done':''}" data-step="${s.id}"><div class="step-head"><input class="step-check" type="checkbox" ${done?'checked':''} aria-label="Marcar ${esc(s.title)} como completado"><div><div class="step-number">Paso ${s.sort_order} de ${steps.length}</div><div class="step-title">${esc(s.title)}</div></div></div><textarea maxlength="2000" placeholder="Añadir una nota compartida para este paso">${esc(p?.notes||'')}</textarea>${p?.updated_at?`<small class="step-last-edit">Última modificación: ${esc(who)} · ${esc(when)}</small>`:''}<div class="step-actions"><button type="button" class="btn alt save-team-note">Guardar nota</button></div></article>`}).join('')}</div><button type="button" class="btn alt" id="close-team-route">Cerrar expediente</button></section>`;
  box.querySelectorAll('.step-check').forEach(input=>input.addEventListener('change',()=>saveTeamAgentStep(input.closest('.step'),input.checked?'completed':'pending',input)));
  box.querySelectorAll('.save-team-note').forEach(button=>button.addEventListener('click',()=>saveTeamAgentStep(button.closest('.step'),button.closest('.step').querySelector('.step-check').checked?'completed':'pending',button)));
  $('close-team-route').addEventListener('click',()=>{state.selectedTeamAgent=null;box.innerHTML='';});
 }catch(e){if(box.isConnected)box.innerHTML=`<p class="note error">${esc(friendly(e))}</p>`;}
}
async function saveTeamAgentStep(row,status,control){
 const selected=state.selectedTeamAgent;if(!selected||!state.isBuilder)return;
 const stepId=Number(row.dataset.step),notes=row.querySelector('textarea').value.trim();
 control.disabled=true;
 try{
  const payload={agent_id:selected.id,step_id:stepId,status,notes:notes||null,completed_at:status==='completed'?new Date().toISOString():null,completed_on:status==='completed'?localDate():null,updated_at:new Date().toISOString(),updated_by:state.user.id};
  const {error}=await sb.from('agent_progress').upsert(payload,{onConflict:'agent_id,step_id'});if(error)throw error;
  // Refresh both the shared detail and the team summary without resetting the whole dashboard.
  await loadTeamAgentProgress();
  const {data,error:listError}=await sb.from('applications').select('id,agent_id,full_name,wfg_id,status,created_at').eq('constructor_id',state.user.id).order('created_at',{ascending:false});
  if(!listError&&data)await loadTeamProgress(data);
 }catch(e){const box=$('team-agent-detail');if(box)box.insertAdjacentHTML('afterbegin',`<p class="note error" role="alert">No se guardó el cambio: ${esc(friendly(e))}</p>`);control.disabled=false;}
}
async function busy(button,fn){button.disabled=true;try{await fn()}catch(e){setMessage(friendly(e),true)}finally{button.disabled=false}}
function friendly(e){const msg=e?.message||'Operación no completada';if(/invalid login credentials/i.test(msg))return 'Credenciales incorrectas.';if(/email not confirmed/i.test(msg))return 'Debes verificar primero tu correo.';if(/already registered/i.test(msg))return 'Este correo ya tiene una cuenta. Inicia sesión.';return msg;}
function attach(){
 const on=(id,fn)=>{const el=$(id);if(el)el.addEventListener('click',fn)};
 on('start',()=>go('choose'));on('to-login',()=>go('login'));on('to-signup',()=>go('signup'));on('back',()=>go(state.page==='choose'?'welcome':'choose'));on('forgot',()=>go('forgot'));
 on('notifications-button',()=>{const panel=$('notifications-panel'),menu=$('quick-menu-panel'),button=$('notifications-button');if(!panel||!button)return;if(menu)menu.hidden=true;$('quick-menu-button')?.setAttribute('aria-expanded','false');const opening=panel.hidden;panel.hidden=!opening;button.setAttribute('aria-expanded',String(opening));if(opening)renderNotifications();});
 on('quick-menu-button',()=>{const panel=$('quick-menu-panel'),notifications=$('notifications-panel'),button=$('quick-menu-button');if(!panel||!button)return;if(notifications)notifications.hidden=true;$('notifications-button')?.setAttribute('aria-expanded','false');const opening=panel.hidden;panel.hidden=!opening;button.setAttribute('aria-expanded',String(opening));});
 document.querySelectorAll('[data-quick-target]').forEach(b=>b.addEventListener('click',()=>b.dataset.quickTarget==='constructor-profile-panel'?openConstructorProfile():quickNavigate(b.dataset.quickTarget)));$('reports-menu-button')?.addEventListener('click',openBusinessReport);
 document.querySelectorAll('[data-builder-quick]').forEach(b=>b.addEventListener('click',()=>quickBuilderNavigate(b.dataset.builderQuick)));
 on('toggle-prospects',()=>{const panel=$('prospects-panel'),button=$('toggle-prospects');if(!panel||!button)return;const opening=panel.hidden;panel.hidden=!opening;button.setAttribute('aria-expanded',String(opening));button.textContent=opening?'Cerrar prospectos':'Abrir prospectos';if(opening)renderProspects();});
 on('toggle-planner',()=>{const panel=$('planner-panel'),button=$('toggle-planner');if(!panel||!button)return;const opening=panel.hidden;panel.hidden=!opening;button.setAttribute('aria-expanded',String(opening));button.textContent=opening?'Cerrar calendario':'Abrir calendario';if(opening)renderPlannerPanel();});
 const search=$('app-search');if(search)search.addEventListener('input',()=>runAppSearch(search.value));
 on('toggle-builder-center',()=>{state.builderCenterOpen=!state.builderCenterOpen;const center=$('builder-center'),button=$('toggle-builder-center');if(center)center.hidden=!state.builderCenterOpen;if(button){button.setAttribute('aria-expanded',String(state.builderCenterOpen));button.textContent=state.builderCenterOpen?'Cerrar Centro del Constructor':'Abrir Centro del Constructor';}});
 document.querySelectorAll('[data-builder-tab]').forEach(button=>button.addEventListener('click',()=>{const tab=button.dataset.builderTab;state.builderTab=state.builderTab===tab?'home':tab;document.querySelectorAll('[data-builder-tab]').forEach(b=>{const selected=b.dataset.builderTab===state.builderTab;b.classList.toggle('active',selected);b.setAttribute('aria-expanded',String(selected));});document.querySelectorAll('.builder-tool-panel').forEach(p=>p.hidden=p.id!=='builder-tab-'+state.builderTab);if(state.builderTab!=='home')$('builder-tab-'+state.builderTab)?.scrollIntoView({block:'nearest',behavior:'smooth'});}));
 on('toggle-recognitions',()=>toggleRecognitions());
 on('toggle-builder-recognitions',()=>{const panel=$('builder-recognitions-panel'),button=$('toggle-builder-recognitions');if(!panel||!button)return;const opening=panel.hidden;panel.hidden=!opening;button.setAttribute('aria-expanded',String(opening));button.textContent=opening?'Ocultar catálogo':'Ver catálogo de reconocimientos';if(opening&&!panel.dataset.loaded){panel.dataset.loaded='true';panel.innerHTML=recognitionGallery(null,false);}});
 on('go-own-route',()=>{state.builderCenterOpen=false;const center=$('builder-center'),button=$('toggle-builder-center');if(center)center.hidden=true;if(button){button.setAttribute('aria-expanded','false');button.textContent='Abrir Centro del Constructor';}$('path-title')?.scrollIntoView({block:'start',behavior:'smooth'});});
 on('signout',async()=>{await sb.auth.signOut();state.user=null;state.application=null;state.isBuilder=false;go('welcome')});
 on('make-invite',async()=>{await busy($('make-invite'),async()=>{const token=await call('create_invitation',{});const link=`${location.origin}${location.pathname}?invite=${encodeURIComponent(token)}`;const dest=$('generated-invite');dest.innerHTML=`<label class="field"><span>Enlace de invitación</span><input readonly aria-label="Enlace de invitación" value="${esc(link)}"></label><button type="button" class="btn alt" id="copy-invite">Copiar enlace</button>`;$('copy-invite').addEventListener('click',()=>navigator.clipboard.writeText(link).then(()=>setMessage('Enlace copiado.')).catch(()=>setMessage('Selecciona y copia el enlace mostrado.')));});});
 const submit=(id,fn)=>{const el=$(id);if(el)el.addEventListener('submit',async e=>{e.preventDefault();const button=el.querySelector('button[type=submit],button:not([type])');await busy(button,()=>fn(new FormData(el)));});};
 submit('login-form',async f=>{const {error}=await sb.auth.signInWithPassword({email:String(f.get('email')).trim(),password:String(f.get('password'))});if(error)throw error;await loadDashboard();});
 submit('signup-form',async f=>{if(!ready)throw Error('Configura primero Supabase.');const invite=String(f.get('invite')).trim();if(!invite)throw Error('Necesitas una invitación.');const {data,error}=await sb.auth.signUp({email:String(f.get('email')).trim(),password:String(f.get('password')),
  options:{emailRedirectTo:location.origin+location.pathname, data:{}}});if(error)throw error;
  // Never submit an invitation to public user metadata; the authenticated RPC validates it after email verification.
  state.invite=invite;
  sessionStorage.setItem('progressia_pending',JSON.stringify({full_name:String(f.get('full_name')).trim(),wfg_id:String(f.get('wfg_id')).trim(),invite,privacy_version:VERSION}));
  if(data.session){await sendPending();await loadDashboard();}else{setMessage('Cuenta creada. Revisa tu correo y abre el enlace de verificación desde este navegador. Después inicia sesión para enviar la solicitud.');}
 });
 submit('claim-form',async f=>{await call('claim_invitation',{p_token:String(f.get('invite')).trim(),p_full_name:String(f.get('full_name')).trim(),p_wfg_id:String(f.get('wfg_id')).trim(),p_privacy_version:VERSION});sessionStorage.removeItem('progressia_pending');await loadDashboard();});
 submit('reset-form',async f=>{const {error}=await sb.auth.resetPasswordForEmail(String(f.get('email')).trim(),{redirectTo:location.origin+location.pathname});if(error)throw error;setMessage('Si existe una cuenta con ese correo, recibirás instrucciones para recuperar el acceso.');});
 submit('password-form',async f=>{const password=String(f.get('password'));const confirmation=String(f.get('password_confirm'));if(password.length<8)throw Error('La contraseña debe tener al menos 8 caracteres.');if(password!==confirmation)throw Error('Las contraseñas no coinciden.');const {error}=await sb.auth.updateUser({password});if(error)throw error;state.recoveryMode=false;history.replaceState(null,'',location.pathname+location.search);await loadDashboard();setMessage('Contraseña actualizada. Ya puedes usarla para iniciar sesión.');});
}
async function sendPending(){const raw=sessionStorage.getItem('progressia_pending');if(!raw)return;const pending=JSON.parse(raw);await call('claim_invitation',{p_token:pending.invite,p_full_name:pending.full_name,p_wfg_id:pending.wfg_id,p_privacy_version:pending.privacy_version});sessionStorage.removeItem('progressia_pending');}
async function start(){if(!ready){render();setMessage('Vista previa: falta configurar VITE_SUPABASE_URL y VITE_SUPABASE_ANON_KEY. No hay cuentas reales conectadas.',true);return;}
 sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){state.recoveryMode=true;state.user=session?.user||state.user;setTimeout(()=>go('password'),0);}});
 const {data:{session}}=await sb.auth.getSession();
 if(state.recoveryMode&&session?.user){state.user=session.user;go('password');return;}
 if(session?.user){try{await sendPending();await loadDashboard()}catch(e){await loadDashboard();setMessage('Tu cuenta existe, pero la solicitud no se completó: '+friendly(e),true)}}else render();
}
start();
</script>
</body></html>
