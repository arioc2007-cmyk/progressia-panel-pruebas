</style></head><body><div id="app"><main class="shell"><section class="panel"><h1>Progressia Pruebas</h1><p class="muted">Cargando aplicación…</p></section></main></div><script type="module">import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';


const url='https://whirgbendpbeduscnzks.supabase.co';
const key='sb_publishable_fF1ny0R1ZPLcw503_RUknw_rKm08OHq';
const ready=!!(url&&key&&!url.includes('TU-PROYECTO')&&!key.includes('TU_CLAVE'));
const openedFromRecoveryLink=new URLSearchParams(location.hash.slice(1)).get('type')==='recovery';
const sb=ready?createClient(url,key,{auth:{detectSessionInUrl:true,autoRefreshToken:true,persistSession:true}}):null;
const qs=new URLSearchParams(location.search);
const initialInvite=qs.get('invite')||'';
const VERSION='privacidad-borrador-2026-09-20';
const $=id=>document.getElementById(id);
const localDate=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={page:'welcome',invite:initialInvite,user:null,application:null,isBuilder:false,recoveryMode:openedFromRecoveryLink,msg:'',error:false,steps:[],progress:[],sponsorClaim:null,gx:null,selectedTeamAgent:null,builderCenterOpen:false,builderTab:'home'};
const logo='<img class="brand" src="/logo-progressia.png" alt="Isotipo y marca Progressia, Desarrolla, Duplica, Avanza">';
const small='<img class="brand-small" src="/logo-progressia.png" alt="Progressia">';
const info=()=>state.msg?`<div class="note ${state.error?'error':'success'}" role="status">${esc(state.msg)}</div>`:'';
function setMessage(text,error=false){state.msg=text;state.error=error;render()}
const btn=(text,id,klass='')=>`<button class="btn ${klass}" id="${id}" type="button">${text}</button>`;
const field=(title,name,type='text',value='',attrs='')=>`<label class="field"><span>${title}</span><input name="${name}" type="${type}" value="${esc(value)}" ${attrs} required></label>`;
const privacy=`<div class="privacy" id="privacy"><strong>AVISO DE PRIVACIDAD · BORRADOR PARA PRUEBAS</strong><p>Progressia es una plataforma independiente de seguimiento del desarrollo de agentes. Responsable provisional: Luilly Rivero; antes del lanzamiento se identificará la entidad operadora, domicilio y contacto verificable.</p><h3>Datos tratados</h3><p>Nombre, correo, ID WFG que declara el agente, constructor asociado, invitación, estados de aprobación y registros de auditoría. La autenticación está gestionada por el proveedor configurado. No introduzcas datos reales hasta completar la revisión legal y los controles de producción.</p><h3>Finalidades y accesos</h3><p>Crear la cuenta, verificar el correo, gestionar invitaciones y permitir que el constructor directo revise y apruebe la solicitud. El constructor ve únicamente las solicitudes asociadas a sus invitaciones. Un administrador técnico no recibe acceso libre a los expedientes por su función.</p><h3>Almacenamiento y terceros</h3><p>El proveedor de autenticación y base de datos configurado procesará la información para ofrecer el servicio. Región, condiciones, plazos de conservación, transferencias y posibles proveedores adicionales deberán concretarse antes del lanzamiento público.</p><h3>Derechos y seguridad</h3><p>Antes de activar usuarios reales se publicarán los canales de contacto, las instrucciones para ejercer derechos aplicables, los plazos de conservación y el procedimiento de incidentes. Los permisos deben verificarse en el servidor y la base de datos.</p><h3>Independencia</h3><p>Progressia no afirma estar afiliada, aprobada ni conectada a WFG. El constructor verifica manualmente el ID declarado; ello no equivale a una verificación oficial automatizada.</p></div>`;
function render(){
 const header=state.page==='welcome'?'':`<div class="top">${small}<span class="tag">Desarrolla · Duplica · Avanza</span></div>`;
 let body='';
 if(state.page==='welcome')body=`<div class="center"><p class="lead">Bienvenido(a) a</p>${logo}<p class="muted">Tu desarrollo comienza aquí.</p><p class="note">ENTORNO DE PRUEBAS · Solo cuentas y datos ficticios. No ingreses información real de agentes.</p>${btn('Comenzar →','start')}<p class="muted">${state.invite?'Tu invitación fue detectada y se conservará durante el registro.':'Ingresa mediante el enlace o QR de tu constructor para crear una cuenta.'}</p></div>`;
 if(state.page==='choose')body=`<h1>¿Cómo deseas continuar?</h1><p class="muted">Accede a tu espacio de desarrollo.</p>${btn('Ya tengo una cuenta','to-login')}${btn('Soy nuevo: crear mi cuenta','to-signup','alt')}${btn('Volver','back','link')}`;
 if(state.page==='login')body=`<h1>Iniciar sesión</h1><form id="login-form">${field('Correo electrónico','email','email','', 'autocomplete="email"')}${field('Contraseña','password','password','', 'autocomplete="current-password" minlength="8"') }<button class="btn">Entrar</button></form>${btn('Olvidé mi contraseña','forgot','link')}${btn('Volver','back','alt')}`;
 if(state.page==='signup')body=`<h1>Crear mi cuenta</h1><p class="muted">Tu constructor verificará manualmente el ID de WFG y aprobará tu solicitud después de la verificación de correo.</p><form id="signup-form">${field('Nombre completo','full_name','text','', 'maxlength="120" autocomplete="name"')}${field('Correo electrónico','email','email','', 'autocomplete="email"')}${field('ID de agente WFG','wfg_id','text','', 'maxlength="40" pattern="[A-Za-z0-9-]{2,40}"')}${field('Código de invitación','invite','text',state.invite,'maxlength="80"')}${field('Contraseña (mínimo 8 caracteres)','password','password','', 'autocomplete="new-password" minlength="8"')}${privacy}<label class="checkbox"><input name="accept" type="checkbox" required><span>He leído el aviso de privacidad provisional de esta prueba y solicito registrar mi cuenta. Entiendo que el acceso requiere confirmación de correo y aprobación del constructor.</span></label><button class="btn">Crear cuenta y enviar correo</button></form>${btn('Volver','back','alt')}`;
 if(state.page==='forgot')body=`<h1>Recuperar acceso</h1><form id="reset-form">${field('Correo de tu cuenta','email','email','', 'autocomplete="email"')}<button class="btn">Enviar instrucciones</button></form>${btn('Volver','to-login','alt')}`;
 if(state.page==='password')body=`<h1>Actualizar contraseña</h1><p class="muted">Escribe y confirma tu nueva contraseña.</p><form id="password-form">${field('Nueva contraseña','password','password','', 'minlength="8" autocomplete="new-password"')}${field('Confirmar contraseña','password_confirm','password','', 'minlength="8" autocomplete="new-password"')}<button class="btn">Guardar contraseña</button></form>`;
 if(state.page==='dashboard'){
  const a=state.application;
  const accountStatus=state.isBuilder?'Cuenta de constructor activa.':a?`Solicitud: ${a.status==='pending'?'Pendiente de aprobación del constructor':a.status==='approved'?'Aprobada':'Rechazada'}`:'No hay solicitud vinculada a esta cuenta.';
  body=`<h1>Mi cuenta</h1><p class="muted">${esc(state.user?.email||'')}</p><p class="status">${accountStatus}</p>${a?`<p><strong>Nombre:</strong> ${esc(a.full_name)}<br><strong>ID WFG declarado:</strong> ${esc(a.wfg_id)}</p>`:''}${!a&&!state.isBuilder?`<p class="muted">Si ya verificaste tu correo, completa tu solicitud utilizando la invitación.</p><form id="claim-form">${field('Nombre completo','full_name','text','', 'maxlength="120"')}${field('ID de agente WFG','wfg_id','text','', 'maxlength="40" pattern="[A-Za-z0-9-]{2,40}"')}${field('Código de invitación','invite','text',state.invite,'maxlength="80"')}${privacy}<label class="checkbox"><input name="accept" type="checkbox" required><span>Acepto el aviso de privacidad provisional de la prueba.</span></label><button class="btn">Enviar solicitud al constructor</button></form>`:''}${a?.status==='approved'&&!state.isBuilder?`<hr class="divider"><section aria-labelledby="impact-title"><h2 id="impact-title" class="impact-header">Mi impacto</h2><div id="protection-summary" aria-live="polite">Cargando indicadores de protección…</div></section>`:''}${a&&['pending','approved'].includes(a.status)&&!state.isBuilder?`<hr class="divider"><section aria-labelledby="path-title"><h2 id="path-title">Mi ruta de desarrollo</h2>${a.status==='pending'?'<p class="note">Tu solicitud está pendiente, pero ya puedes avanzar en tus tareas. La aprobación del constructor no es necesaria para registrar tu progreso.</p>':''}<div id="agent-progress">Cargando progreso…</div></section><hr class="divider"><section aria-labelledby="sponsor-title"><h2 id="sponsor-title">La persona que te registró en WFG</h2><p class="muted">Indica el código WFG de la persona que te registró en WFG. Puede ser distinta de quien te invitó a Progressia. Tu declaración quedará pendiente hasta que se compruebe con evidencia independiente autorizada.</p><div id="sponsor-box">Cargando declaración…</div></section>${a.status==='approved'?`<hr class="divider"><section aria-labelledby="gx-title"><h2 id="gx-title">GX y reconocimientos</h2><p class="muted">Resumen calculado con producción y estructura WFG verificadas.</p><div id="gx-progress">Cargando GX…</div><hr class="divider"><h3>Mis reconocimientos</h3><p class="muted recognition-intro">Explora las imágenes de GX y los premios de reconocimiento. Los niveles solo figuran como confirmados si existe un registro de reconocimiento confirmado.</p><button type="button" class="btn alt" id="toggle-recognitions" aria-expanded="false" aria-controls="recognitions-panel">Ver mis reconocimientos</button><div id="recognitions-panel" hidden></div></section>`:''}`:''}${state.isBuilder?`<hr class="divider"><section class="builder-entrance" aria-label="Acceso al Centro del Constructor"><h2>Centro del Constructor</h2><p class="muted">Gestiona tu equipo, invitaciones, ruta de desarrollo y reconocimientos desde un solo lugar.</p><button type="button" class="btn" id="toggle-builder-center" aria-expanded="${state.builderCenterOpen}" aria-controls="builder-center">${state.builderCenterOpen?'Cerrar Centro del Constructor':'Abrir Centro del Constructor'}</button></section><section id="builder-center" class="builder-center" ${state.builderCenterOpen?'':'hidden'} aria-labelledby="builder-center-title"><div class="builder-center-head"><div><h2 id="builder-center-title">Centro del Constructor</h2><p class="muted">Desarrolla · Duplica · Avanza</p></div></div><div class="builder-stats" aria-label="Resumen del equipo"><div class="builder-stat"><span aria-hidden="true">♙</span><strong id="builder-agents-count">…</strong><span>Agentes en mi equipo</span></div><div class="builder-stat"><span aria-hidden="true">✚</span><strong id="builder-pending-count">…</strong><span>Solicitudes pendientes</span></div><div class="builder-stat"><span aria-hidden="true">↗</span><strong id="builder-average-progress">…</strong><span>Progreso promedio</span></div><div class="builder-stat"><span aria-hidden="true">🏆</span><strong id="builder-pending-prizes">—</strong><span>Premios pendientes</span></div></div><p class="gx-help">El progreso promedio se calcula entre agentes aprobados. Los premios pendientes aparecerán cuando esté disponible la gestión de entregas.</p><h3>Herramientas de gestión</h3><nav class="builder-nav" aria-label="Herramientas del constructor"><button type="button" class="builder-nav-button" data-builder-tab="path" aria-controls="builder-tab-path" aria-expanded="${state.builderTab==='path'}"><span class="builder-nav-icon" aria-hidden="true">◎</span><span><strong>Mi ruta de desarrollo</strong><small>Mis 16 pasos personales.</small></span></button><button type="button" class="builder-nav-button" data-builder-tab="invites" aria-controls="builder-tab-invites" aria-expanded="${state.builderTab==='invites'}"><span class="builder-nav-icon" aria-hidden="true">↗</span><span><strong>Invitaciones y solicitudes</strong><small>Invitar agentes y gestionar aprobaciones.</small></span></button><button type="button" class="builder-nav-button" data-builder-tab="team" aria-controls="builder-tab-team" aria-expanded="${state.builderTab==='team'}"><span class="builder-nav-icon" aria-hidden="true">♧</span><span><strong>Mi equipo</strong><small>Consultar y actualizar las rutas y notas de mis agentes.</small></span></button><button type="button" class="builder-nav-button" data-builder-tab="gx" aria-controls="builder-tab-gx" aria-expanded="${state.builderTab==='gx'}"><span class="builder-nav-icon" aria-hidden="true">▥</span><span><strong>Producción y GX</strong><small>Seguimiento del equipo: integración pendiente.</small></span></button><button type="button" class="builder-nav-button" data-builder-tab="recognitions" aria-controls="builder-tab-recognitions" aria-expanded="${state.builderTab==='recognitions'}"><span class="builder-nav-icon" aria-hidden="true">☆</span><span><strong>Gestión de reconocimientos</strong><small>Catálogo visual; pedidos y entregas pendientes.</small></span></button></nav><section id="build function go(page){state.page=page;state.msg='';render()}
async function call(name,args){const {data,error}=await sb.rpc(name,args);if(error)throw error;return data;}
async function loadDashboard(){if(!sb)return;const {data:{user}}=await sb.auth.getUser();state.user=user;
 if(!user){state.application=null;state.isBuilder=false;go('welcome');return;}
 const [{data:app,error:appError},{data:builder,error:builderError}]=await Promise.all([sb.from('applications').select('id,full_name,wfg_id,status').eq('agent_id',user.id).maybeSingle(),sb.from('constructors').select('user_id').eq('user_id',user.id).maybeSingle()]);
 if(appError||builderError){setMessage('No se pudo consultar el estado de tu cuenta. Comprueba la configuración y los permisos de la base de datos.',true);return;}
 state.application=app;state.isBuilder=!!builder;state.builderCenterOpen=false;state.builderTab='home';go('dashboard');
}
async function loadRequests(){if(state.page!=='dashboard'||!state.isBuilder)return;
 const {data,error}=await sb.from('applications').select('id,agent_id,full_name,wfg_id,status,created_at').eq('constructor_id',state.user.id).order('created_at',{ascending:false});
 const box=$('requests');if(!box)return;
 if(error){box.textContent='No se pudieron consultar las solicitudes.';for(const id of ['builder-agents-count','builder-pending-count','builder-average-progress']){const el=$(id);if(el)el.textContent='—';}return;}
 const approved=data.filter(a=>a.status==='approved'),pending=data.filter(a=>a.status==='pending');if($('builder-agents-count'))$('builder-agents-count').textContent=String(approved.length);if($('builder-pending-count'))$('builder-pending-count').textContent=String(pending.length);
 box.innerHTML=data.length?data.map(a=>`<div class="note" data-application="${esc(a.id)}"><strong>${esc(a.full_name)}</strong><br>ID WFG declarado: ${esc(a.wfg_id)}<br>Estado: ${esc(a.status)}<br><small>${esc(new Date(a.created_at).toLocaleString('es-US'))}</small>${a.status==='pending'?`<p>Comprueba el ID por un procedimiento autorizado antes de aprobar. Progressia no lo verifica automáticamente.</p><button class="btn approve" data-id="${esc(a.id)}">He verificado el ID: aprobar</button><button class="btn alt reject" data-id="${esc(a.id)}">Rechazar solicitud</button>`:''}</div>`).join(''):'<p class="muted">Aún no tienes solicitudes.</p>';
 box.querySelectorAll('.approve,.reject').forEach(b=>b.addEventListener('click',async()=>{if(!confirm(b.classList.contains('approve')?'¿Confirmas que verificaste manualmente el ID y deseas aprobar?':'¿Confirmas que deseas rechazar esta solicitud?'))return;await busy(b,async()=>{await call('review_application',{p_application_id:b.dataset.id,p_approve:b.classList.contains('approve')});setMessage('Se registró tu decisión.');});}));
 await loadTeamProgress(data);
}
function pct(completed,total){return total?Math.round(completed*100/total):0}
async function getStepsAndProgress(agentIds){
 const progressQuery=agentIds.length?sb.from('agent_progress').select('agent_id,step_id,status,notes,due_date,updated_at,updated_by').in('agent_id',agentIds):Promise.resolve({data:[],error:null});
 const [{data:steps,error:stepError},{data:progress,error:progressError}]=await Promise.all([sb.from('progress_steps').select('id,title,sort_order').order('sort_order'),progressQuery]);
 if(stepError||progressError)throw stepError||progressError;
 return {steps,progress};
}
async function loadBuilderProgressSummary(){
 const box=$('builder-progress-summary');if(!box||!state.isBuilder)return;
 try{
  const {steps,progress}=await getStepsAndProgress([state.user.id]);if(!box.isConnected)return;
  const doneIds=new Set(progress.filter(p=>p.status==='completed').map(p=>p.step_id));
  const completed=steps.filter(s=>doneIds.has(s.id)).length;
  const percent=pct(completed,steps.length);
  const next=steps.find(s=>!doneIds.has(s.id));
  box.innerHTML=`<div class="summary-grid"><div class="summary-card"><span>Mis pasos completados</span><strong>${completed} / ${steps.length}</strong></div><div class="summary-card"><span>Mi avance</span><strong>${percent}%</strong></div></div><div class="progress-track" role="progressbar" aria-label="Mi ruta de desarrollo" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percent}"><div class="progress-fill" style="width:${percent}%"></div></div><p class="muted">${next?'Próximo paso: '+esc(next.title):'¡Completaste tu ruta de desarrollo!'}</p>`;
 }catch(e){box.innerHTML=`<p class="note error">${esc(friendly(e))}</p>`}
}
async function loadAgentProgress(){
 const box=state.isBuilder?$('builder-progress'):$('agent-progress');if(!box)return;
 try{
  const {steps,progress}=await getStepsAndProgress([state.user.id]);if(!box.isConnected)return;state.steps=steps;state.progress=progress;
  const byStep=new Map(progress.map(p=>[p.step_id,p]));const completed=progress.filter(p=>p.status==='completed').length;const percent=pct(completed,steps.length);const next=steps.find(s=>byStep.get(s.id)?.status!=='completed');
  box.innerHTML=`<div class="summary-grid"><div class="summary-card"><span>Progreso total</span><strong>${percent}%</strong></div><div class="summary-card"><span>Próximo paso</span><strong style="font-size:1rem">${esc(next?.title||'Ruta completada')}</strong></div></div><div class="progress-track" aria-label="Progreso ${percent}%"><div class="progress-fill" style="width:${percent}%"></div></div><p class="muted">${completed} de ${steps.length} pasos completados.</p><div class="steps">${steps.map(s=>{const p=byStep.get(s.id);const done=p?.status==='completed';return `<article class="step ${done?'done':''}" data-step="${s.id}"><div class="step-head"><input class="step-check" type="checkbox" ${done?'checked':''} aria-label="Marcar ${esc(s.title)} como completado"><div><div class="step-number">Paso ${s.sort_order} de ${steps.length}</div><div class="step-title">${esc(s.title)}</div></div></div><textarea maxlength="2000" placeholder="Nota compartida con tu constructor">${esc(p?.notes||'')}</textarea>${p?.updated_at?`<small class="step-last-edit">Última modificación: ${esc(p.updated_by===state.user.id?'Tú':'Tu constructor')} · ${esc(new Date(p.updated_at).toLocaleString('es-US'))}</small>`:''}<div class="step-actions"><button type="button" class="btn alt save-note">Guardar nota</button></div></article>`}).join('')}</div>`;
  box.querySelectorAll('.step-check').forEach(input=>input.addEventListener('change',()=>saveAgentStep(input.closest('.step'),input.checked?'completed':'pending')));
  box.querySelectorAll('.save-note').forEach(button=>button.addEventListener('click',()=>saveAgentStep(button.closest('.step'),button.closest('.step').querySelector('.step-check').checked?'completed':'pending',button)));
 }catch(e){box.innerHTML=`<p class="note error">${esc(friendly(e))}</p>`}
}
async function saveAgentStep(row,status,button){
 const control=button||row.querySelector('.step-check');const stepId=Number(row.dataset.step);const notes=row.querySelector('textarea').value.trim();
 await busy(control,async()=>{const payload={agent_id:state.user.id,step_id:stepId,status,notes:notes||null,completed_at:status==='completed'?new Date().toISOString():null,completed_on:status==='completed'?localDate():null,updated_at:new Date().toISOString(),updated_by:state.user.id};const {error}=await sb.from('agent_progress').upsert(payload,{onConflict:'agent_id,step_id'});if(error)throw error;await loadAgentProgress();if(state.isBuilder)await loadBuilderProgressSummary();});
}

async function loadSponsorClaim(){
 const box=$('sponsor-box');if(!box||!state.application)return;
 try{
  const {data,error}=await sb.from('gx_sponsor_claims').select('sponsor_wfg_id,status,enrolled_on').eq('agent_id',state.user.id).maybeSingle();
  if(error)throw error;if(!box.isConnected)return;state.sponsorClaim=data;
  if(!data){box.innerHTML=`<form id="sponsor-form">${field('Código WFG de la persona que te registró en WFG','sponsor_wfg_id','text','', 'maxlength="40" pattern="[A-Za-z0-9-]{2,40}"')}<label class="checkbox"><input name="confirm_sponsor" type="checkbox" required><span>Confirmo que este es el código WFG de la persona que me registró en WFG. Entiendo que escribirlo no significa que ya haya sido verificado.</span></label><button class="btn">Guardar código de la persona que me registró</button></form><p class="muted"><small>Guardar este código no verifica la relación. Permanecerá pendiente y no contará para GX hasta completar una comprobación independiente autorizada.</small></p>`;attachSponsorForm();return;}

  box.innerHTML=`<div class="note ${data.status==='verified'?'success':''}"><strong>Código de la persona que te registró en WFG:</strong> ${esc(data.sponsor_wfg_id)}<br><strong>Estado:</strong> ${esc(label)}${data.enrolled_on?`<br><strong>Fecha de incorporación verificada:</strong> ${esc(data.enrolled_on)}`:''}</div>`;
 }catch(e){box.innerHTML=`<p class="note error">${esc(friendly(e))}</p>`}
}
function attachSponsorForm(){const form=$('sponsor-form');if(!form)return;form.addEventListener('submit',async e=>{e.preventDefault();const button=form.querySelector('button');await busy(button,async()=>{const f=new FormData(form);const result=await call('submit_gx_sponsor',{p_sponsor_wfg_id:String(f.get('sponsor_wfg_id')).trim()});await loadSponsorClaim();setMessage(result==='pending'?'Código guardado. La relación con la persona que te registró en WFG está pendiente de verificación independiente.':'Código registrado.');});});}
async function loadProtectionSummary(){

function recognitionGallery(confirmed,showStatus){
 const gxCards=Array.from({length:12},(_,i)=>{
  const level=i+1,verified=confirmed?.has(level),status=showStatus?(confirmed===null?'Confirmación no consultada':verified?'Reconocimiento confirmado':'Sin confirmación registrada'):'Logo del nivel GX';
  return `<article class="recognition-card ${verified?'is-confirmed':''}"><img src="./reconocimientos/gx${String(level).padStart(2,'0')}.webp" alt="Logo GX${level}" loading="lazy" width="250" height="250"><strong>GX${level}</strong><small>${esc(status)}</small></article>`;
 }).join('');
 const prizes=RECOGNITION_PRIZES.map(prize=>`<article class="recognition-prize"><img src="./reconocimientos/${prize.image}" alt="${esc(prize.title)}" loading="lazy" width="500" height="500"><strong>${esc(prize.title)}</strong><small>${esc(prize.detail)} · No indica que el premio esté confirmado.</small></article>`).join('');
 return `<div class="recognition-panel"><h4>Camisas GX · 12 niveles</h4><p class="recognition-note">Se muestra el logo de cada nivel, no una fotografía de la camisa. Solo los registros confirmados se marcan como alcanzados.</p><div class="recognition-grid">${gxCards}</div><h4>Premios con imagen disponible</h4><div class="recognition-prizes">${prizes}</div><div class="recognition-remaining"><strong>Imágenes pendientes:</strong> camisa de Asociado (3-3-30), chaqueta SMD, certificado de licenciamiento, placas de Cash Flow $10,000 y $30,000, y anillos de $500,000 y $1,000,000.</div><p class="recognition-note">Las fotografías de los premios son versiones editadas de las referencias recibidas. Este catálogo es visual: no crea pedidos, no verifica Cash Flow y no confirma entregas.</p></div>`;

async function toggleRecognitions(){

function renderGXEntry(panel){
 panel.className='gx-entry';
 panel.innerHTML=`<h3>Registrar póliza para GX</h3><p class="gx-help">Registra el producto y los importes de una póliza de prueba. Los puntos se calculan automáticamente según la compañía. Los puntos pendientes NO se suman a los cuatro indicadores oficiales hasta su verificación independiente. No introduzcas nombres de clientes ni datos reales durante esta prueba.</p><form id="gx-production-form" class="gx-actions"><label><span>Código de persona protegida</span><input type="text" name="insured" minlength="2" maxlength="40" pattern="[A-Za-z0-9_-]{2,40}" required placeholder="Ej.: PERSONA-001" autocomplete="off"></label><p class="gx-help">Utiliza el mismo código ficticio si registras otra póliza para la misma persona. No introduzcas nombres, correos ni identificaciones reales.</p><label><span>Producto de la póliza</span><input type="text" name="product" minlength="2" maxlength="80" required placeholder="Ej.: IUL" autocomplete="off"></label><label><span>Compañía</span><select name="company" required><option value="">Selecciona una compañía</option><option value="transamerica">Transamerica · 125 %</option><option value="nationwide">Nationwide · 109 %</option><option value="national_life_group">National Life Group · 96 %</option></select></label><label><span>Prima target mensual ($)</span><input type="number" name="premium" min="0.01" max="100000000" step="0.01" inputmode="decimal" required placeholder="Ej.: 456.67"></label><label><span>Cobertura ($)</span><input type="number" name="coverage" min="0.01" max="1000000000000" step="0.01" inputmode="decimal" required placeholder="Ej.: 1000000.00"></label><div id="gx-policy-preview" class="gx-preview" aria-live="polite">Selecciona la compañía y escribe la prima target mensual para calcular los puntos.</div><label><span>Fecha de producción</span><input type="date" name="date" max="${localDate()}" required></label><label><span>Referencia para revisión (opcional)</span><input type="text" name="reference" maxlength="200" placeholder="Referencia de prueba, sin datos personales"></label><button class="btn" type="submit">Registrar póliza pendiente</button></form><p id="gx-entry-message" role="status" aria-live="polite"></p><div id="gx-production-list" aria-live="polite">Cargando pólizas…</div><div class="gx-separator"></div><h3>Simular mi próximo GX</h3><p class="gx-help">Introduce cifras hipotéticas para explorar la fórmula de niveles GX. No modifica los cuatro indicadores oficiales ni registra producción o socios.</p><form id="gx-sim-form" class="gx-actions"><label><span>Puntos en 12 meses</span><input name="points" type="number" min="0" max="999999999" step="1" inputmode="numeric" required value="${Math.floor(Number(state.gx?.points_rolling||0))}"></label><label><span>Socios verificados en 12 meses</span><input name="partners" type="number" min="0" max="999999" step="1" inputmode="numeric" required value="${Number(state.gx?.partners_rolling||0)}"></label><label class="checkbox"><input name="gate" type="checkbox" ${state.gx?.gx1_earned?'checked':''}><span>En algún mes se alcanzaron al menos 15.000 puntos Y 3 socios (condición inicial GX1).</span></label><button class="btn alt" type="submit">Calcular simulación</button></form><div id="gx-sim-result" class="note" role="status" aria-live="polite" hidden></div>`;
 const form=$('gx-production-form');
 const updatePreview=()=>{
  const company=form.elements.company.value,premium=Number(form.elements.premium.value),factor=GX_FACTORS[company];
  const preview=$('gx-policy-preview');
  if(!factor||!form.elements.premium.value||!Number.isFinite(premium)||premium<=0){preview.textContent='Selecciona la compañía y escribe la prima target mensual para calcular los puntos.';return;}
  const calculated=Math.round((premium*12*factor+Number.EPSILON)*100)/100;
  preview.innerHTML=`<span>Vista previa · ${esc(GX_COMPANIES[company])} (${Math.round(factor*100)} %)</span><strong>${gxPoints(calculated)} puntos</strong><small>${gxMoney(premium)} × 12 meses × ${factor.toFixed(2)}. La cobertura es informativa; no modifica el cálculo.</small>`;
 };
 form.elements.company.addEventListener('change',updatePreview);
 form.elements.premium.addEventListener('input',updatePreview);
 form.addEventListener('submit',async e=>{
  e.preventDefault();const button=form.querySelector('button[type="submit"]'),msg=$('gx-entry-message');
  const f=new FormData(form),insured=String(f.get('insured')).trim().toUpperCase(),product=String(f.get('product')).trim(),company=String(f.get('company')),
        premium=Number(f.get('premium')),coverage=Number(f.get('coverage')),date=String(f.get('date'));
  if(!/^[A-Z0-9_-]{2,40}$/.test(insured)||product.length<2||product.length>80||!GX_FACTORS[company]||!Number.isFinite(premium)||premium<=0||premium>100000000||Math.round(premium*100)!==premium*100&&Math.abs(Math.round(premium*100)-premium*100)>1e-6||!Number.isFinite(coverage)||coverage<=0||coverage>1000000000000||Math.abs(Math.round(coverage*100)-coverage*100)>1e-6||!date||date>localDate()){
   msg.textContent='Revisa el producto, la compañía, los importes y la fecha. Utiliza un máximo de dos decimales.';return;
  }
  button.disabled=true;msg.textContent='Guardando póliza de prueba…';
  try{
   await call('submit_gx_policy_v2',{p_company:company,p_product_name:product,p_target_premium:premium,p_coverage:coverage,p_production_date:date,p_insured_reference:insured,p_external_reference:String(f.get('reference')).trim()||null});
   const pts=Math.round((premium*12*GX_FACTORS[company]+Number.EPSILON)*100)/100;
   msg.textContent=`Póliza guardada con ${gxPoints(pts)} puntos calculados, pendientes de verificación independiente. Los cuatro indicadores oficiales no han cambiado.`;
   form.reset();updatePreview();await Promise.all([loadPendingGX(),loadProtectionSummary()]);
  }catch(e){msg.textContent=friendly(e);}finally{button.disabled=false;}
 });
 $('gx-sim-form').addEventListener('submit',e=>{
  e.preventDefault();const f=new FormData(e.currentTarget),pts=Number(f.get('points')),partners=Number(f.get('partners')),gate=f.get('gate')==='on';
  const box=$('gx-sim-result');box.hidden=false;
  if(!Number.isSafeInteger(pts)||!Number.isSafeInteger(partners)||pts<0||partners<0){box.textContent='Introduce números enteros válidos.';return;}
  const gx=gate?Math.min(12,Math.floor(pts/15000),Math.floor(partners/3)):0;
  const next=Math.min(12,gx+1),needPts=gx>=12?0:Math.max(0,next*15000-pts),needPartners=gx>=12?0:Math.max(0,next*3-partners);
  box.textContent=`Simulación: GX${gx}. ${gx>=12?'GX12 según los valores simulados.':`Para GX${next}: faltan ${needPts.toLocaleString('es-US')} puntos y ${needPartners} socios, siempre que se cumplan las reglas aplicables.`} No modifica tus indicadores oficiales ni calcula un máximo histórico.`;
 });
}
async function loadPendingGX(){
 const box=$('gx-production-list');if(!box)return;
 try{
  const {data,error}=await sb.from('gx_production').select('id,company,product_name,insured_reference,target_premium,coverage,factor_applied,production_date,points,verified_at,voided_at').eq('agent_id',state.user.id).order('created_at',{ascending:false}).limit(15);
  if(error)throw error;if(!box.isConnected)return;
  box.innerHTML=`<h3>Mis pólizas recientes</h3>${data.length?data.map(p=>`<div class="note ${p.verified_at&&!p.voided_at?'success':''}"><strong>${esc(p.product_name||'Producto no registrado')}</strong> · ${esc(GX_COMPANIES[p.company]||p.company)}${p.insured_reference?`<br>Persona: ${esc(p.insured_reference)}`:''}<br>Fecha: ${esc(p.production_date)}<br>Prima target mensual: ${gxMoney(p.target_premium)}${p.coverage!=null?`<br>Cobertura: ${gxMoney(p.coverage)}`:''}${p.factor_applied!=null?`<br>Factor aplicado: ${Number(p.factor_applied)*100} %`:''}<br>Puntos calculados: ${p.points==null?'Pendientes de cálculo':gxPoints(p.points)}<br><strong>Estado: ${p.voided_at?'Anulada':p.verified_at?'Verificada y contabilizada':'Pendiente · no contabilizada'}</strong></div>`).join(''):'<p class="gx-help">Aún no hay pólizas registradas.</p>'}`;
 }catch(e){box.textContent='No fue posible consultar tus pólizas: '+friendly(e);}
}

async function loadTeamProgress(applications){
 const box=$('team-progress');if(!box)return;
 const members=applications.filter(a=>['pending','approved'].includes(a.status));
 if(!members.length){if($('builder-average-progress'))$('builder-average-progress').textContent='—';box.innerHTML='<p class="muted">Aún no tienes agentes con solicitudes pendientes o aprobadas.</p>';state.selectedTeamAgent=null;const detail=$('team-agent-detail');if(detail)detail.innerHTML='';return;}
 try{
  const {steps,progress}=await getStepsAndProgress(members.map(a=>a.agent_id));if(!box.isConnected)return;
  const approved=members.filter(a=>a.status==='approved');const avg=approved.length?Math.round(approved.reduce((sum,a)=>sum+pct(progress.filter(p=>p.agent_id===a.agent_id&&p.status==='completed').length,steps.length),0)/approved.length):null;if($('builder-average-progress'))$('builder-average-progress').textContent=avg===null?'—':avg+'%';
  box.innerHTML=members.map(a=>{
   const rows=progress.filter(p=>p.agent_id===a.agent_id),completed=rows.filter(p=>p.status==='completed').length,percent=pct(completed,steps.length);
   const doneIds=new Set(rows.filter(p=>p.status==='completed').map(p=>p.step_id));const next=steps.find(s=>!doneIds.has(s.id));
   return `<article class="team-card"><div class="topline"><div><strong>${esc(a.full_name)}</strong><br><small>ID: ${esc(a.wfg_id)} · ${a.status==='pending'?'Solicitud pendiente':'Solicitud aprobada'}</small></div>${a.status==='approved'?`<span class="percent">${percent}%</span>`:'<span class="percent">—</span>'}</div>${a.status==='approved'?`<div class="progress-track"><div class="progress-fill" style="width:${percent}%"></div></div><small>${completed} de ${steps.length} pasos. Próximo: ${esc(next?.title||'Ruta completada')}</small><button class="btn alt open-team-route" type="button" data-agent-id="${esc(a.agent_id)}" aria-label="Abrir ruta de ${esc(a.full_name)}">Abrir ruta y notas</button>`:'<p class="gx-help">El avance se mostrará cuando la solicitud esté aprobada. Solo entonces podrás abrir y editar su ruta.</p>'}</article>`;
  }).join('');
  box.querySelectorAll('.open-team-route').forEach(b=>b.addEventListener('click',()=>{
   const a=members.find(x=>x.agent_id===b.dataset.agentId&&x.status==='approved');if(!a)return;
   if(state.selectedTeamAgent?.id===a.agent_id){state.selectedTeamAgent=null;const detail=$('team-agent-detail');if(detail)detail.innerHTML='';return;}
   state.selectedTeamAgent={id:a.agent_id,name:a.full_name};loadTeamAgentProgress();
  }));
  if(state.selectedTeamAgent){const selected=members.find(a=>a.agent_id===state.selectedTeamAgent.id&&a.status==='approved');if(selected){state.selectedTeamAgent.name=selected.full_name;loadTeamAgentProgress();}else{state.selectedTeamAgent=null;const detail=$('team-agent-detail');if(detail)detail.innerHTML='';}}
 }catch(e){if($('builder-average-progress'))$('builder-average-progress').textContent='—';box.innerHTML=`<p class="note error">${esc(friendly(e))}</p>`}
}
async function loadTeamAgentProgress(){
 const box=$('team-agent-detail'),selected=state.selectedTeamAgent;
 if(!box||!selected||!state.isBuilder)return;
 box.innerHTML='<p class="muted">Cargando la ruta del agente…</p>';
 try{
  // A fresh membership check avoids relying only on a client-side selected ID.
  const {data:member,error:memberError}=await sb.from('applications').select('agent_id,full_name,status').eq('agent_id',selected.id).eq('constructor_id',state.user.id).eq('status','approved').maybeSingle();
  if(memberError)throw memberError;
  if(!member)throw Error('Solo puedes editar las rutas de los agentes aprobados de tu equipo.');
  const {steps,progress}=await getStepsAndProgress([member.agent_id]);
  if(!box.isConnected||state.selectedTeamAgent?.id!==member.agent_id)return;
  const byStep=new Map(progress.map(p=>[p.step_id,p]));const completed=steps.filter(s=>byStep.get(s.id)?.status==='completed').length;const percent=pct(completed,steps.length);
  box.innerHTML=`<section class="team-agent-detail" aria-label="Ruta del agente"><h3>Ruta de ${esc(member.full_name)}</h3><p class="muted">${completed} de ${steps.length} pasos completados · ${percent}%</p><div class="progress-track" role="progressbar" aria-label="Avance del agente" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percent}"><div class="progress-fill" style="width:${percent}%"></div></div><p class="gx-help">El agente y tú comparten estas tareas y notas. La última modificación guardada prevalece si ambos editan al mismo tiempo.</p><div class="steps">${steps.map(s=>{const p=byStep.get(s.id);const done=p?.status==='completed';const who=p?.updated_by===member.agent_id?'Agente':p?.updated_by===state.user.id?'Constructor':'Sin registrar';const when=p?.updated_at?new Date(p.updated_at).toLocaleString('es-US'):'';return `<article class="step ${done?'done':''}" data-step="${s.id}"><div class="step-head"><input class="step-check" type="checkbox" ${done?'checked':''} aria-label="Marcar ${esc(s.title)} como completado"><div><div class="step-number">Paso ${s.sort_order} de ${steps.length}</div><div class="step-title">${esc(s.title)}</div></div></div><textarea maxlength="2000" placeholder="Añadir una nota compartida para este paso">${esc(p?.notes||'')}</textarea>${p?.updated_at?`<small class="step-last-edit">Última modificación: ${esc(who)} · ${esc(when)}</small>`:''}<div class="step-actions"><button type="button" class="btn alt save-team-note">Guardar nota</button></div></article>`}).join('')}</div><button type="button" class="btn alt" id="close-team-route">Cerrar expediente</button></section>`;
  box.querySelectorAll('.step-check').forEach(input=>input.addEventListener('change',()=>saveTeamAgentStep(input.closest('.step'),input.checked?'completed':'pending',input)));
  box.querySelectorAll('.save-team-note').forEach(button=>button.addEventListener('click',()=>saveTeamAgentStep(button.closest('.step'),button.closest('.step').querySelector('.step-check').checked?'completed':'pending',button)));
  $('close-team-route').addEventListener('click',()=>{state.selectedTeamAgent=null;box.innerHTML='';});
 }catch(e){if(box.isConnected)box.innerHTML=`<p class="note error">${esc(friendly(e))}</p>`;}
}
async function saveTeamAgentStep(row,status,control){
 const selected=state.selectedTeamAgent;if(!selected||!state.isBuilder)return;
 const stepId=Number(row.dataset.step),notes=row.querySelector('textarea').value.trim();
 control.disabled=true;
 try{
  const payload={agent_id:selected.id,step_id:stepId,status,notes:notes||null,completed_at:status==='completed'?new Date().toISOString():null,completed_on:status==='completed'?localDate():null,updated_at:new Date().toISOString(),updated_by:state.user.id};
  const {error}=await sb.from('agent_progress').upsert(payload,{onConflict:'agent_id,step_id'});if(error)throw error;
  // Refresh both the shared detail and the team summary without resetting the whole dashboard.
  await loadTeamAgentProgress();
  const {data,error:listError}=await sb.from('applications').select('id,agent_id,full_name,wfg_id,status,created_at').eq('constructor_id',state.user.id).order('created_at',{ascending:false});
  if(!listError&&data)await loadTeamProgress(data);
 }catch(e){const box=$('team-agent-detail');if(box)box.insertAdjacentHTML('afterbegin',`<p class="note error" role="alert">No se guardó el cambio: ${esc(friendly(e))}</p>`);control.disabled=false;}
}
async function busy(button,fn){button.disabled=true;try{await fn()}catch(e){setMessage(friendly(e),true)}finally{button.disabled=false}}
function friendly(e){const msg=e?.message||'Operación no completada';if(/invalid login credentials/i.test(msg))return 'Credenciales incorrectas.';if(/email not confirmed/i.test(msg))return 'Debes verificar primero tu correo.';if(/already registered/i.test(msg))return 'Este correo ya tiene una cuenta. Inicia sesión.';return msg;}
function attach(){
 const on=(id,fn)=>{const el=$(id);if(el)el.addEventListener('click',fn)};
 on('start',()=>go('choose'));on('to-login',()=>go('login'));on('to-signup',()=>go('signup'));on('back',()=>go(state.page==='choose'?'welcome':'choose'));on('forgot',()=>go('forgot'));
 on('toggle-builder-center',()=>{state.builderCenterOpen=!state.builderCenterOpen;const center=$('builder-center'),button=$('toggle-builder-center');if(center)center.hidden=!state.builderCenterOpen;if(button){button.setAttribute('aria-expanded',String(state.builderCenterOpen));button.textContent=state.builderCenterOpen?'Cerrar Centro del Constructor':'Abrir Centro del Constructor';}});
 document.querySelectorAll('[data-builder-tab]').forEach(button=>button.addEventListener('click',()=>{const tab=button.dataset.builderTab;state.builderTab=state.builderTab===tab?'home':tab;document.querySelectorAll('[data-builder-tab]').forEach(b=>{const selected=b.dataset.builderTab===state.builderTab;b.classList.toggle('active',selected);b.setAttribute('aria-expanded',String(selected));});document.querySelectorAll('.builder-tool-panel').forEach(p=>p.hidden=p.id!=='builder-tab-'+state.builderTab);if(state.builderTab!=='home')$('builder-tab-'+state.builderTab)?.scrollIntoView({block:'nearest',behavior:'smooth'});}));
 on('toggle-recognitions',()=>toggleRecognitions());
 on('toggle-builder-progress',()=>{
  const section=$('builder-progress-details'),button=$('toggle-builder-progress');
  if(!section||!button)return;
  const opening=section.hidden;
  section.hidden=!opening;
  button.setAttribute('aria-expanded',String(opening));
  button.textContent=opening?'Ocultar mi ruta de desarrollo':'Mi ruta de desarrollo';
  if(opening&&!section.dataset.loaded){section.dataset.loaded='true';loadAgentProgress();}
 });
 on('signout',async()=>{await sb.auth.signOut();state.user=null;state.application=null;state.isBuilder=false;go('welcome')});
 on('make-invite',async()=>{await busy($('make-invite'),async()=>{const token=await call('create_invitation',{});const link=`${location.origin}${location.pathname}?invite=${encodeURIComponent(token)}`;const dest=$('generated-invite');dest.innerHTML=`<label class="field"><span>Enlace de invitación</span><input readonly aria-label="Enlace de invitación" value="${esc(link)}"></label><button type="button" class="btn alt" id="copy-invite">Copiar enlace</button>`;$('copy-invite').addEventListener('click',()=>navigator.clipboard.writeText(link).then(()=>setMessage('Enlace copiado.')).catch(()=>setMessage('Selecciona y copia el enlace mostrado.')));});});
 const submit=(id,fn)=>{const el=$(id);if(el)el.addEventListener('submit',async e=>{e.preventDefault();const button=el.querySelector('button[type=submit],button:not([type])');await busy(button,()=>fn(new FormData(el)));});};
 submit('login-form',async f=>{const {error}=await sb.auth.signInWithPassword({email:String(f.get('email')).trim(),password:String(f.get('password'))});if(error)throw error;await loadDashboard();});
 submit('signup-form',async f=>{if(!ready)throw Error('Configura primero Supabase.');const invite=String(f.get('invite')).trim();if(!invite)throw Error('Necesitas una invitación.');const {data,error}=await sb.auth.signUp({email:String(f.get('email')).trim(),password:String(f.get('password')),
  options:{emailRedirectTo:location.origin+location.pathname, data:{}}});if(error)throw error;
  // Never submit an invitation to public user metadata; the authenticated RPC validates it after email verification.
  state.invite=invite;
  sessionStorage.setItem('progressia_pending',JSON.stringify({full_name:String(f.get('full_name')).trim(),wfg_id:String(f.get('wfg_id')).trim(),invite,privacy_version:VERSION}));
  if(data.session){await sendPending();await loadDashboard();}else{setMessage('Cuenta creada. Revisa tu correo y abre el enlace de verificación desde este navegador. Después inicia sesión para enviar la solicitud.');}
 });
 submit('claim-form',async f=>{await call('claim_invitation',{p_token:String(f.get('invite')).trim(),p_full_name:String(f.get('full_name')).trim(),p_wfg_id:String(f.get('wfg_id')).trim(),p_privacy_version:VERSION});sessionStorage.removeItem('progressia_pending');await loadDashboard();});
 submit('reset-form',async f=>{const {error}=await sb.auth.resetPasswordForEmail(String(f.get('email')).trim(),{redirectTo:location.origin+location.pathname});if(error)throw error;setMessage('Si existe una cuenta con ese correo, recibirás instrucciones para recuperar el acceso.');});
 submit('password-form',async f=>{const password=String(f.get('password'));const confirmation=String(f.get('password_confirm'));if(password.length<8)throw Error('La contraseña debe tener al menos 8 caracteres.');if(password!==confirmation)throw Error('Las contraseñas no coinciden.');const {error}=await sb.auth.updateUser({password});if(error)throw error;state.recoveryMode=false;history.replaceState(null,'',location.pathname+location.search);await loadDashboard();setMessage('Contraseña actualizada. Ya puedes usarla para iniciar sesión.');});
}
async function sendPending(){const raw=sessionStorage.getItem('progressia_pending');if(!raw)return;const pending=JSON.parse(raw);await call('claim_invitation',{p_token:pending.invite,p_full_name:pending.full_name,p_wfg_id:pending.wfg_id,p_privacy_version:pending.privacy_version});sessionStorage.removeItem('progressia_pending');}
async function start(){if(!ready){render();setMessage('Vista previa: falta configurar VITE_SUPABASE_URL y VITE_SUPABASE_ANON_KEY. No hay cuentas reales conectadas.',true);return;}
 sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){state.recoveryMode=true;state.user=session?.user||state.user;setTimeout(()=>go('password'),0);}});
 const {data:{session}}=await sb.auth.getSession();
 if(state.recoveryMode&&session?.user){state.user=session.user;go('password');return;}
 if(session?.user){try{await sendPending();await loadDashboard()}catch(e){await loadDashboard();setMessage('Tu cuenta existe, pero la solicitud no se completó: '+friendly(e),true)}}else render();
}
start();
</script>
</body></html>
