x}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.status{font-size:.85rem;color:#5a6472;padding:9px 11px;background:#f1f4f7;border-radius:10px}h1{font-size:1.6rem;margin:9px 0}h2{font-size:1.18rem}p{line-height:1.55}a{color:#172c43}.checkbox{display:flex;align-items:start;gap:9px;font-size:.9rem;line-height:1.5;margin:14px 0}.checkbox input{margin-top:4px}.privacy{max-height:220px;overflow:auto;border:1px solid #d5dce5;border-radius:12px;padding:13px;background:#fcfcfc;font-size:.88rem;line-height:1.5}.privacy h3{margin:12px 0 4px}.privacy p{margin:4px 0 10px} .divider{border:0;border-top:1px solid #e1e6ed;margin:18px 0}.footer{text-align:center;font-size:.77rem;color:#687587;margin-top:20px}
.summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}.summary-card{background:#f1f4f7;border-radius:14px;padding:14px}.summary-card strong{display:block;font-size:1.45rem}.progress-track{height:12px;border-radius:999px;background:#e4e9ef;overflow:hidden;margin:9px 0}.progress-fill{height:100%;background:#c69b51;border-radius:inherit;transition:width .25s}.steps{display:grid;gap:10px;margin-top:14px}.step{border:1px solid #d5dce5;border-radius:14px;padding:13px;background:#fff}.step.done{background:#eef8f2;border-color:#b7dcc5}.step-head{display:flex;align-items:flex-start;gap:10px}.step-check{width:22px;height:22px;accent-color:#172c43;flex:0 0 auto}.step-title{font-weight:750;line-height:1.35}.step-number{font-size:.76rem;color:#6b7787}.step textarea{width:100%;min-height:64px;border:1px solid #c7d0dc;border-radius:10px;padding:10px;margin-top:10px;resize:vertical}.step-actions{display:flex;justify-content:flex-end}.step-actions button{width:auto;padding:9px 13px;font-size:.84rem}.team-card{border:1px solid #d5dce5;border-radius:14px;padding:14px;margin:10px 0}.team-card .topline{display:flex;justify-content:space-between;gap:12px;align-items:center}.team-card .percent{font-weight:800;color:#8a6425}@media(max-width:420px){.summary-grid{grid-template-columns:1fr}.panel{padding:22px 18px}.step{padding:12px}}
</style></head><body><div id="app"><main class="shell"><section class="panel"><h1>Progressia Pruebas</h1><p class="muted">Cargando aplicación…</p></section></main></div><script type="module">import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';


const url='https://whirgbendpbeduscnzks.supabase.co';
const key='sb_publishable_fF1ny0R1ZPLcw503_RUknw_rKm08OHq';
const ready=!!(url&&key&&!url.includes('TU-PROYECTO')&&!key.includes('TU_CLAVE'));
const openedFromRecoveryLink=new URLSearchParams(location.hash.slice(1)).get('type')==='recovery';
const sb=ready?createClient(url,key,{auth:{detectSessionInUrl:true,autoRefreshToken:true,persistSession:true}}):null;
const qs=new URLSearchParams(location.search);
const initialInvite=qs.get('invite')||'';
const VERSION='privacidad-borrador-2026-09-20';
const $=id=>document.getElementById(id);
const localDate=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={page:'welcome',invite:initialInvite,user:null,application:null,isBuilder:false,recoveryMode:openedFromRecoveryLink,msg:'',error:false,steps:[],progress:[],sponsorClaim:null,gx:null};
const logo='<img class="brand" src="/logo-progressia.png" alt="Isotipo y marca Progressia, Desarrolla, Duplica, Avanza">';
const small='<img class="brand-small" src="/logo-progressia.png" alt="Progressia">';
const info=()=>state.msg?`<div class="note ${state.error?'error':'success'}" role="status">${esc(state.msg)}</div>`:'';
function setMessage(text,error=false){state.msg=text;state.error=error;render()}
const btn=(text,id,klass='')=>`<button class="btn ${klass}" id="${id}" type="button">${text}</button>`;
const field=(title,name,type='text',value='',attrs='')=>`<label class="field"><span>${title}</span><input name="${name}" type="${type}" value="${esc(value)}" ${attrs} required></label>`;
const privacy=`<div class="privacy" id="privacy"><strong>AVISO DE PRIVACIDAD · BORRADOR PARA PRUEBAS</strong><p>Progressia es una plataforma independiente de seguimiento del desarrollo de agentes. Responsable provisional: Luilly Rivero; antes del lanzamiento se identificará la entidad operadora, domicilio y contacto verificable.</p><h3>Datos tratados</h3><p>Nombre, correo, ID WFG que declara el agente, constructor asociado, invitación, estados de aprobación y registros de auditoría. La autenticación está gestionada por el proveedor configurado. No introduzcas datos reales hasta completar la revisión legal y los controles de producción.</p><h3>Finalidades y accesos</h3><p>Crear la cuenta, verificar el correo, gestionar invitaciones y permitir que el constructor directo revise y apruebe la solicitud. El constructor ve únicamente las solicitudes asociadas a sus invitaciones. Un administrador técnico no recibe acceso libre a los expedientes por su función.</p><h3>Almacenamiento y terceros</h3><p>El proveedor de autenticación y base de datos configurado procesará la información para ofrecer el servicio. Región, condiciones, plazos de conservación, transferencias y posibles proveedores adicionales deberán concretarse antes del lanzamiento público.</p><h3>Derechos y seguridad</h3><p>Antes de activar usuarios reales se publicarán los canales de contacto, las instrucciones para ejercer derechos aplicables, los plazos de conservación y el procedimiento de incidentes. Los permisos deben verificarse en el servidor y la base de datos.</p><h3>Independencia</h3><p>Progressia no afirma estar afiliada, aprobada ni conectada a WFG. El constructor verifica manualmente el ID declarado; ello no equivale a una verificación oficial automatizada.</p></div>`;
function render(){
 const header=state.page==='welcome'?'':`<div class="top">${small}<span class="tag">Desarrolla · Duplica · Avanza</span></div>`;
 let body='';
 if(state.page==='welcome')body=`<div class="center"><p class="lead">Bienvenido(a) a</p>${logo}<p class="muted">Tu desarrollo comienza aquí.</p><p class="note">ENTORNO DE PRUEBAS · Solo cuentas y datos ficticios. No ingreses información real de agentes.</p>${btn('Comenzar →','start')}<p class="muted">${state.invite?'Tu invitación fue detectada y se conservará durante el registro.':'Ingresa mediante el enlace o QR de tu constructor para crear una cuenta.'}</p></div>`;
 if(state.page==='choose')body=`<h1>¿Cómo deseas continuar?</h1><p class="muted">Accede a tu espacio de desarrollo.</p>${btn('Ya tengo una cuenta','to-login')}${btn('Soy nuevo: crear mi cuenta','to-signup','alt')}${btn('Volver','back','link')}`;
 if(state.page==='login')body=`<h1>Iniciar sesión</h1><form id="login-form">${field('Correo electrónico','email','email','', 'autocomplete="email"')}${field('Contraseña','password','password','', 'autocomplete="current-password" minlength="8"') }<button class="btn">Entrar</button></form>${btn('Olvidé mi contraseña','forgot','link')}${btn('Volver','back','alt')}`;
 if(state.page==='signup')body=`<h1>Crear mi cuenta</h1><p class="muted">Tu constructor verificará manualmente el ID de WFG y aprobará tu solicitud después de la verificación de correo.</p><form id="signup-form">${field('Nombre completo','full_name','text','', 'maxlength="120" autocomplete="name"')}${field('Correo electrónico','email','email','', 'autocomplete="email"')}${field('ID de agente WFG','wfg_id','text','', 'maxlength="40" pattern="[A-Za-z0-9-]{2,40}"')}${field('Código de invitación','invite','text',state.invite,'maxlength="80"')}${field('Contraseña (mínimo 8 caracteres)','password','password','', 'autocomplete="new-password" minlength="8"')}${privacy}<label class="checkbox"><input name="accept" type="checkbox" required><span>He leído el aviso de privacidad provisional de esta prueba y solicito registrar mi cuenta. Entiendo que el acceso requiere confirmación de correo y aprobación del constructor.</span></label><button class="btn">Crear cuenta y enviar correo</button></form>${btn('Volver','back','alt')}`;
 if(state.page==='forgot')body=`<h1>Recuperar acceso</h1><form id="reset-form">${field('Correo de tu cuenta','email','email','', 'autocomplete="email"')}<button class="btn">Enviar instrucciones</button></form>${btn('Volver','to-login','alt')}`;
 if(state.page==='password')body=`<h1>Actualizar contraseña</h1><p class="muted">Escribe y confirma tu nueva contraseña.</p><form id="password-form">${field('Nueva contraseña','password','password','', 'minlength="8" autocomplete="new-password"')}${field('Confirmar contraseña','password_confirm','password','', 'minlength="8" autocomplete="new-password"')}<button class="btn">Guardar contraseña</button></form>`;
 if(state.page==='dashboard'){
  const a=state.application;
  const accountStatus=state.isBuilder?'Cuenta de constructor activa.':a?`Solicitud: ${a.status==='pending'?'Pendiente de aprobación del constructor':a.status==='approved'?'Aprobada':'Rechazada'}`:'No hay solicitud vinculada a esta cuenta.';
  body=`<h1>Mi cuenta</h1><p class="muted">${esc(state.user?.email||'')}</p><p class="status">${accountStatus}</p>${a?`<p><strong>Nombre:</strong> ${esc(a.full_name)}<br><strong>ID WFG declarado:</strong> ${esc(a.wfg_id)}</p>`:''}${!a&&!state.isBuilder?`<p class="muted">Si ya verificaste tu correo, completa tu solicitud utilizando la invitación.</p><form id="claim-form">${field('Nombre completo','full_name','text','', 'maxlength="120"')}${field('ID de agente WFG','wfg_id','text','', 'maxlength="40" pattern="[A-Za-z0-9-]{2,40}"')}${field('Código de invitación','invite','text',state.invite,'maxlength="80"')}${privacy}<label class="checkbox"><input name="accept" type="checkbox" required><span>Acepto el aviso de privacidad provisional de la prueba.</span></label><button class="btn">Enviar solicitud al constructor</button></form>`:''}${a&&['pending','approved'].includes(a.status)&&!state.isBuilder?`<hr class="divider"><section aria-labelledby="path-title"><h2 id="path-title">Mi ruta de desarrollo</h2>${a.status==='pending'?'<p class="note">Tu solicitud está pendiente, pero ya puedes avanzar en tus tareas. La aprobación del constructor no es necesaria para registrar tu progreso.</p>':''}<div id="agent-progress">Cargando progreso…</div></section><hr class="divider"><section aria-labelledby="sponsor-title"><h2 id="sponsor-title">Patrocinador directo WFG</h2><p class="muted">Tu patrocinador WFG puede ser distinto de la persona que te invitó a Progressia. Esta declaración queda pendiente hasta una verificación independiente autorizada.</p><div id="sponsor-box">Cargando declaración…</div></section>${a.status==='approved'?`<hr class="divider"><section aria-labelledby="gx-title"><h2 id="gx-title">Reconocimiento GX</h2><p class="muted">Resumen calculado con producción y estructura WFG verificadas.</p><div id="gx-progress">Cargando GX…</div></section>`:''}`:''}${state.isBuilder?`<hr class="divider"><h2>Panel del constructor</h2><p class="muted">Crea un enlace de invitación para que un agente solicite incorporarse.</p>${btn('Crear enlace de invitación','make-invite')}<div id="generated-invite"></div><h2>Solicitudes recibidas</h2><div id="requests" class="stack">Cargando solicitudes…</div><hr class="divider"><h2>Progreso del equipo</h2><div id="team-progress">Cargando equipo…</div>`:''}${btn('Cerrar sesión','signout','alt')}`;
 }
 $('app').innerHTML=`<main class="shell"><section class="panel">${header}${body}${info()}</section><p class="footer">PROGRESSIA · Prototipo de integración. Sin pagos ni conexión oficial con WFG.</p></main>`;
 attach();
 if(state.page==='dashboard'&&state.isBuilder)loadRequests();
 if(state.page==='dashboard'&&!state.isBuilder&&['pending','approved'].includes(state.application?.status)){loadAgentProgress();loadSponsorClaim();if(state.application.status==='approved')loadGXProgress();}
}
function go(page){state.page=page;state.msg='';render()}
async function call(name,args){const {data,error}=await sb.rpc(name,args);if(error)throw error;return data;}
async function loadDashboard(){if(!sb)return;const {data:{user}}=await sb.auth.getUser();state.user=user;
 if(!user){state.application=null;state.isBuilder=false;go('welcome');return;}
 const [{data:app,error:appError},{data:builder,error:builderError}]=await Promise.all([sb.from('applications').select('id,full_name,wfg_id,status').eq('agent_id',user.id).maybeSingle(),sb.from('constructors').select('user_id').eq('user_id',user.id).maybeSingle()]);
 if(appError||builderError){setMessage('No se pudo consultar el estado de tu cuenta. Comprueba la configuración y los permisos de la base de datos.',true);return;}
 state.application=app;state.isBuilder=!!builder;go('dashboard');
}
async function loadRequests(){if(state.page!=='dashboard'||!state.isBuilder)return;
 const {data,error}=await sb.from('applications').select('id,agent_id,full_name,wfg_id,status,created_at').eq('constructor_id',state.user.id).order('created_at',{ascending:false});
 const box=$('requests');if(!box)return;
 if(error){box.textContent='No se pudieron consultar las solicitudes.';return;}
 box.innerHTML=data.length?data.map(a=>`<div class="note" data-application="${esc(a.id)}"><strong>${esc(a.full_name)}</strong><br>ID WFG declarado: ${esc(a.wfg_id)}<br>Estado: ${esc(a.status)}<br><small>${esc(new Date(a.created_at).toLocaleString('es-US'))}</small>${a.status==='pending'?`<p>Comprueba el ID por un procedimiento autorizado antes de aprobar. Progressia no lo verifica automáticamente.</p><button class="btn approve" data-id="${esc(a.id)}">He verificado el ID: aprobar</button><button class="btn alt reject" data-id="${esc(a.id)}">Rechazar solicitud</button>`:''}</div>`).join(''):'<p class="muted">Aún no tienes solicitudes.</p>';
 box.querySelectorAll('.approve,.reject').forEach(b=>b.addEventListener('click',async()=>{if(!confirm(b.classList.contains('approve')?'¿Confirmas que verificaste manualmente el ID y deseas aprobar?':'¿Confirmas que deseas rechazar esta solicitud?'))return;await busy(b,async()=>{await call('review_application',{p_application_id:b.dataset.id,p_approve:b.classList.contains('approve')});setMessage('Se registró tu decisión.');});}));
 await loadTeamProgress(data);
}
function pct(completed,total){return total?Math.round(completed*100/total):0}
async function getStepsAndProgress(agentIds){
 const progressQuery=agentIds.length?sb.from('agent_progress').select('agent_id,step_id,status,notes,due_date,updated_at').in('agent_id',agentIds):Promise.resolve({data:[],error:null});
 const [{data:steps,error:stepError},{data:progress,error:progressError}]=await Promise.all([sb.from('progress_steps').select('id,title,sort_order').order('sort_order'),progressQuery]);
 if(stepError||progressError)throw stepError||progressError;
 return {steps,progress};
}
async function loadAgentProgress(){
 const box=$('agent-progress');if(!box)return;
 try{
  const {steps,progress}=await getStepsAndProgress([state.user.id]);if(!box.isConnected)return;state.steps=steps;state.progress=progress;
  const byStep=new Map(progress.map(p=>[p.step_id,p]));const completed=progress.filter(p=>p.status==='completed').length;const percent=pct(completed,steps.length);const next=steps.find(s=>byStep.get(s.id)?.status!=='completed');
  box.innerHTML=`<div class="summary-grid"><div class="summary-card"><span>Progreso total</span><strong>${percent}%</strong></div><div class="summary-card"><span>Próximo paso</span><strong style="font-size:1rem">${esc(next?.title||'Ruta completada')}</strong></div></div><div class="progress-track" aria-label="Progreso ${percent}%"><div class="progress-fill" style="width:${percent}%"></div></div><p class="muted">${completed} de ${steps.length} pasos completados.</p><div class="steps">${steps.map(s=>{const p=byStep.get(s.id);const done=p?.status==='completed';return `<article class="step ${done?'done':''}" data-step="${s.id}"><div class="step-head"><input class="step-check" type="checkbox" ${done?'checked':''} aria-label="Marcar ${esc(s.title)} como completado"><div><div class="step-number">Paso ${s.sort_order} de ${steps.length}</div><div class="step-title">${esc(s.title)}</div></div></div><textarea maxlength="2000" placeholder="Añadir una nota para este paso">${esc(p?.notes||'')}</textarea><div class="step-actions"><button type="button" class="btn alt save-note">Guardar nota</button></div></article>`}).join('')}</div>`;
  box.querySelectorAll('.step-check').forEach(input=>input.addEventListener('change',()=>saveAgentStep(input.closest('.step'),input.checked?'completed':'pending')));
  box.querySelectorAll('.save-note').forEach(button=>button.addEventListener('click',()=>saveAgentStep(button.closest('.step'),button.closest('.step').querySelector('.step-check').checked?'completed':'pending',button)));
 }catch(e){box.innerHTML=`<p class="note error">${esc(friendly(e))}</p>`}
}
async function saveAgentStep(row,status,button){
 const control=button||row.querySelector('.step-check');const stepId=Number(row.dataset.step);const notes=row.querySelector('textarea').value.trim();
 await busy(control,async()=>{const payload={agent_id:state.user.id,step_id:stepId,status,notes:notes||null,completed_at:status==='completed'?new Date().toISOString():null,completed_on:status==='completed'?localDate():null,updated_at:new Date().toISOString(),updated_by:state.user.id};const {error}=await sb.from('agent_progress').upsert(payload,{onConflict:'agent_id,step_id'});if(error)throw error;await loadAgentProgress();});
}

async function loadSponsorClaim(){
 const box=$('sponsor-box');if(!box||!state.application)return;
 try{
  const {data,error}=await sb.from('gx_sponsor_claims').select('sponsor_wfg_id,status,enrolled_on').eq('agent_id',state.user.id).maybeSingle();
  if(error)throw error;if(!box.isConnected)return;state.sponsorClaim=data;
  if(!data){box.innerHTML=`<form id="sponsor-form">${field('ID WFG de tu patrocinador directo','sponsor_wfg_id','text','', 'maxlength="40" pattern="[A-Za-z0-9-]{2,40}"')}<label class="checkbox"><input name="confirm_sponsor" type="checkbox" required><span>Confirmo que este es el ID WFG de mi patrocinador directo y entiendo que la declaración no equivale a una verificación.</span></label><button class="btn">Declarar patrocinador WFG</button></form><p class="muted"><small>Declarar no significa verificar. Una relación pendiente no cuenta para GX hasta completar la verificación autorizada.</small></p>`;attachSponsorForm();return;}
  const label=data.status==='pending'?'Pendiente de verificación independiente':data.status==='verified'?'Verificado':'Rechazado';
  box.innerHTML=`<div class="note ${data.status==='verified'?'success':''}"><strong>Patrocinador declarado:</strong> ${esc(data.sponsor_wfg_id)}<br><strong>Estado:</strong> ${esc(label)}${data.enrolled_on?`<br><strong>Fecha de incorporación verificada:</strong> ${esc(data.enrolled_on)}`:''}</div>`;
 }catch(e){box.innerHTML=`<p class="note error">${esc(friendly(e))}</p>`}
}
function attachSponsorForm(){const form=$('sponsor-form');if(!form)return;form.addEventListener('submit',async e=>{e.preventDefault();const button=form.querySelector('button');await busy(button,async()=>{const f=new FormData(form);const result=await call('submit_gx_sponsor',{p_sponsor_wfg_id:String(f.get('sponsor_wfg_id')).trim()});await loadSponsorClaim();setMessage(result==='pending'?'Patrocinador declarado. La relación quedó pendiente de verificación independiente.':'Declaración registrada.');});});}
async function loadGXProgress(){
 const box=$('gx-progress');if(!box)return;
 try{const data=await call('get_gx_progress',{p_agent_id:state.user.id,p_as_of:localDate()});const x=Array.isArray(data)?data[0]:data;if(!x)throw Error('No se recibió el cálculo GX.');if(!box.isConnected)return;state.gx=x;
 box.innerHTML=`<div class="summary-grid"><div class="summary-card"><span>GX actual</span><strong>GX${esc(x.gx_current)}</strong></div><div class="summary-card"><span>Máximo histórico</span><strong>GX${esc(x.gx_historical_max)}</strong></div><div class="summary-card"><span>Puntos · 12 meses</span><strong>${Number(x.points_rolling||0).toLocaleString('es-US')}</strong></div><div class="summary-card"><span>Socios · 12 meses</span><strong>${esc(x.partners_rolling)}</strong></div></div>${Number(x.gx_current)>=12?'<p class="note success">Nivel GX12 alcanzado en el cálculo actual.</p>':`<p class="muted">Siguiente nivel: GX${esc(x.next_gx)} · faltan ${Number(x.points_to_next||0).toLocaleString('es-US')} puntos y ${esc(x.partners_to_next)} socios dentro de las reglas actuales.</p>`}<p class="muted"><small>El máximo histórico se recalcula con los registros actualmente válidos; una corrección retroactiva puede modificarlo.</small></p>`;
 }catch(e){box.innerHTML=`<p class="note error">${esc(friendly(e))}</p>`}
}

async function loadTeamProgress(applications){
 const box=$('team-progress');if(!box)return;const approved=applications.filter(a=>['pending','approved'].includes(a.status));if(!approved.length){box.innerHTML='<p class="muted">Aún no tienes agentes con solicitudes pendientes o aprobadas.</p>';return;}
 try{const {steps,progress}=await getStepsAndProgress(approved.map(a=>a.agent_id));box.innerHTML=approved.map(a=>{const rows=progress.filter(p=>p.agent_id===a.agent_id);const completed=rows.filter(p=>p.status==='completed').length;const percent=pct(completed,steps.length);const doneIds=new Set(rows.filter(p=>p.status==='completed').map(p=>p.step_id));const next=steps.find(s=>!doneIds.has(s.id));return `<article class="team-card"><div class="topline"><div><strong>${esc(a.full_name)}</strong><br><small>ID: ${esc(a.wfg_id)} · ${a.status==='pending'?'Solicitud pendiente':'Solicitud aprobada'}</small></div><span class="percent">${percent}%</span></div><div class="progress-track"><div class="progress-fill" style="width:${percent}%"></div></div><small>${completed} de ${steps.length} pasos. Próximo: ${esc(next?.title||'Ruta completada')}</small></article>`}).join('');}catch(e){box.innerHTML=`<p class="note error">${esc(friendly(e))}</p>`}
}
async function busy(button,fn){button.disabled=true;try{await fn()}catch(e){setMessage(friendly(e),true)}finally{button.disabled=false}}
function friendly(e){const msg=e?.message||'Operación no completada';if(/invalid login credentials/i.test(msg))return 'Credenciales incorrectas.';if(/email not confirmed/i.test(msg))return 'Debes verificar primero tu correo.';if(/already registered/i.test(msg))return 'Este correo ya tiene una cuenta. Inicia sesión.';return msg;}
function attach(){
 const on=(id,fn)=>{const el=$(id);if(el)el.addEventListener('click',fn)};
 on('start',()=>go('choose'));on('to-login',()=>go('login'));on('to-signup',()=>go('signup'));on('back',()=>go(state.page==='choose'?'welcome':'choose'));on('forgot',()=>go('forgot'));
 on('signout',async()=>{await sb.auth.signOut();state.user=null;state.application=null;state.isBuilder=false;go('welcome')});
 on('make-invite',async()=>{await busy($('make-invite'),async()=>{const token=await call('create_invitation',{});const link=`${location.origin}${location.pathname}?invite=${encodeURIComponent(token)}`;const dest=$('generated-invite');dest.innerHTML=`<label class="field"><span>Enlace de invitación</span><input readonly aria-label="Enlace de invitación" value="${esc(link)}"></label><button type="button" class="btn alt" id="copy-invite">Copiar enlace</button>`;$('copy-invite').addEventListener('click',()=>navigator.clipboard.writeText(link).then(()=>setMessage('Enlace copiado.')).catch(()=>setMessage('Selecciona y copia el enlace mostrado.')));});});
 const submit=(id,fn)=>{const el=$(id);if(el)el.addEventListener('submit',async e=>{e.preventDefault();const button=el.querySelector('button[type=submit],button:not([type])');await busy(button,()=>fn(new FormData(el)));});};
 submit('login-form',async f=>{const {error}=await sb.auth.signInWithPassword({email:String(f.get('email')).trim(),password:String(f.get('password'))});if(error)throw error;await loadDashboard();});
 submit('signup-form',async f=>{if(!ready)throw Error('Configura primero Supabase.');const invite=String(f.get('invite')).trim();if(!invite)throw Error('Necesitas una invitación.');const {data,error}=await sb.auth.signUp({email:String(f.get('email')).trim(),password:String(f.get('password')),
  options:{emailRedirectTo:location.origin+location.pathname, data:{}}});if(error)throw error;
  // Never submit an invitation to public user metadata; the authenticated RPC validates it after email verification.
  state.invite=invite;
  sessionStorage.setItem('progressia_pending',JSON.stringify({full_name:String(f.get('full_name')).trim(),wfg_id:String(f.get('wfg_id')).trim(),invite,privacy_version:VERSION}));
  if(data.session){await sendPending();await loadDashboard();}else{setMessage('Cuenta creada. Revisa tu correo y abre el enlace de verificación desde este navegador. Después inicia sesión para enviar la solicitud.');}
 });
 submit('claim-form',async f=>{await call('claim_invitation',{p_token:String(f.get('invite')).trim(),p_full_name:String(f.get('full_name')).trim(),p_wfg_id:String(f.get('wfg_id')).trim(),p_privacy_version:VERSION});sessionStorage.removeItem('progressia_pending');await loadDashboard();});
 submit('reset-form',async f=>{const {error}=await sb.auth.resetPasswordForEmail(String(f.get('email')).trim(),{redirectTo:location.origin+location.pathname});if(error)throw error;setMessage('Si existe una cuenta con ese correo, recibirás instrucciones para recuperar el acceso.');});
 submit('password-form',async f=>{const password=String(f.get('password'));const confirmation=String(f.get('password_confirm'));if(password.length<8)throw Error('La contraseña debe tener al menos 8 caracteres.');if(password!==confirmation)throw Error('Las contraseñas no coinciden.');const {error}=await sb.auth.updateUser({password});if(error)throw error;state.recoveryMode=false;history.replaceState(null,'',location.pathname+location.search);await loadDashboard();setMessage('Contraseña actualizada. Ya puedes usarla para iniciar sesión.');});
}
async function sendPending(){const raw=sessionStorage.getItem('progressia_pending');if(!raw)return;const pending=JSON.parse(raw);await call('claim_invitation',{p_token:pending.invite,p_full_name:pending.full_name,p_wfg_id:pending.wfg_id,p_privacy_version:pending.privacy_version});sessionStorage.removeItem('progressia_pending');}
async function start(){if(!ready){render();setMessage('Vista previa: falta configurar VITE_SUPABASE_URL y VITE_SUPABASE_ANON_KEY. No hay cuentas reales conectadas.',true);return;}
 sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){state.recoveryMode=true;state.user=session?.user||state.user;setTimeout(()=>go('password'),0);}});
 const {data:{session}}=await sb.auth.getSession();
 if(state.recoveryMode&&session?.user){state.user=session.user;go('password');return;}
 if(session?.user){try{await sendPending();await loadDashboard()}catch(e){await loadDashboard();setMessage('Tu cuenta existe, pero la solicitud no se completó: '+friendly(e),true)}}else render();
}
start();
</script>
</body></html>
